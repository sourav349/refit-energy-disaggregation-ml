[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refit-washing-machine-nilm"
version = "1.0.0"
description = "Reproducible REFIT data-quality, EDA and household-held-out appliance disaggregation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "scikit-learn>=1.3,<2", "matplotlib>=3.7,<4", "joblib>=1.3,<2", "reportlab>=4,<5", "Pillow>=10,<13"]

[tool.setuptools.packages.find]
where = ["src"]
